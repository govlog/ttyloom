help_hooks_short = "programs run on incoming messages (hooks.toml)"
help_hooks_long = "hooks.toml, next to config.toml, lists programs run when an incoming message matches their filters (network, chat, kind, sender, pattern, mention); their output can be sent, put in the input line, shown or ignored. ttyloom never writes the file. /hooks lists the hooks with their counters and last result; /hooks reload reads the file again; /hooks test <name> <text> runs a hook as if you wrote <text> in the current chat: only match is checked, and the output is shown, never sent. The manual: docs/hooks.md."
