help_aggregate_long = "Same as: F6."
help_aggregate_name = "aggregate"
help_aggregate_short = "aggregated window 0: every message, every window (on/off)"
help_alt_arrows_long = ""
help_alt_arrows_name = "Alt+←/→"
help_alt_arrows_short = "previous window, next window"
help_alt_digits_long = "Some desktops take Alt+letter before the terminal: use the F keys for the toggles if Alt does not\nanswer (F6 aggregated view, F4 image mode)."
help_alt_digits_name = "Alt+1..9"
help_alt_digits_short = "goes straight to window 1 to 9 (Alt+0: window 0)"
help_alt_updown_long = "The block is highlighted with a clickable help line. A click on a message does the same."
help_alt_updown_name = "Alt+↑/↓"
help_alt_updown_short = "selects the previous message, the next one"
help_auto_media_max_kb_long = "Above that, the media stays a label opened on demand with /open."
help_auto_media_max_kb_name = "auto_media_max_kb"
help_auto_media_max_kb_short = "max size (KB) of a media downloaded on its own"
help_auto_open_days_long = ""
help_auto_open_days_name = "auto_open_days"
help_auto_open_days_short = "hidden windows opened at start (days of activity, 0 = never)"
help_avatars_long = ""
help_avatars_name = "avatars"
help_avatars_short = "profile photos before the names, in kitty (on/off)"
help_bell_long = "Rings only for a window that is not shown, while the focus is away."
help_bell_name = "bell"
help_bell_short = "terminal bell on a private message or a mention (on/off)"
help_cache_messages_long = "Takes effect at the next start."
help_cache_messages_name = "cache_messages"
help_cache_messages_short = "messages kept per chat on disk"
help_chats_long = "Not available in bot mode."
help_chats_name = "/chats"
help_chats_short = "lists the chats (unread ones highlighted)"
help_clear_long = "Nothing is deleted on the Telegram side. Alias: /c."
help_clear_name = "/clear"
help_clear_short = "empties the current window"
help_close_long = "Same as /window close."
help_close_name = "/close"
help_close_short = "closes the current window (never window 0)"
help_ctrl_ae_long = ""
help_ctrl_ae_name = "Ctrl+A/E"
help_ctrl_ae_short = "start, end of the input line"
help_ctrl_biu_long = "Each key toggles its style at the cursor: what follows takes it until the same key comes again, and the styles stack (Ctrl+U then Ctrl+I: underline+italic). The status bar shows the styles open at the cursor; Backspace on a toggle takes it back. Ctrl+I needs the kitty keyboard protocol (Ghostty, kitty, WezTerm, foot): elsewhere it is Tab. Ctrl+K still deletes to the end of the line."
help_ctrl_biu_name = "Ctrl+B/I/U"
help_ctrl_biu_short = "bold, italic, underline of the draft"
help_ctrl_c_long = "Same as: /quit."
help_ctrl_c_name = "Ctrl+C"
help_ctrl_c_short = "leaves ttyloom"
help_ctrl_f_long = "Typing filters live, without case nor accents, hits highlighted.\nEnter goes up to the previous hit, Ctrl+N goes down, Esc leaves.\nA 2nd Ctrl+F takes the query to every chat (messages.searchGlobal) and opens\nthe result list: ↑/↓, wheel, Enter or a click opens the chat at the message.\nTyping there changes the query, a 3rd Ctrl+F comes back to the local one, Esc closes. Not available in bot mode."
help_ctrl_f_name = "Ctrl+F"
help_ctrl_f_short = "searches the window, then the server"
help_ctrl_l_long = "Like the clear of a terminal: the lines stay in the window and in the history, PgUp or the wheel shows them again. /clear drops them."
help_ctrl_l_name = "Ctrl+L"
help_ctrl_l_short = "clears the window; PgUp brings the lines back"
help_ctrl_n_long = "Same as /new. During a Ctrl+F search, Ctrl+N goes to the next hit."
help_ctrl_n_name = "Ctrl+N"
help_ctrl_n_short = "opens “new chat”"
help_ctrl_t_long = "Same as: /emoji."
help_ctrl_t_name = "Ctrl+T"
help_ctrl_t_short = "opens the emoji picker"
help_ctrl_v_long = "An image (wl-paste or xclip) offers (e) send, (l) caption, (a) cancel."
help_ctrl_v_name = "Ctrl+V"
help_ctrl_v_short = "pastes an image from the clipboard, or text"
help_ctrl_x_long = ""
help_ctrl_x_name = "Ctrl+X"
help_ctrl_x_short = "next window (cycles back to 0); /set cycle_mode last_unread: the unread windows in turn, then back"
help_debug_long = "The warnings (WARN) of the Telegram library show only there; the errors (ERROR)\nalso stay in window 0. Nothing is written to disk."
help_debug_name = "/debug"
help_debug_short = "switches the internal log in place of window 0"
help_download_dir_long = ""
help_download_dir_name = "download_dir"
help_download_dir_short = "directory of the downloaded media"
help_emoji_long = "Typing filters, the arrows or a click choose, Enter inserts, Esc closes."
help_emoji_name = "/emoji"
help_emoji_short = "emoji picker (or Ctrl+T)"
help_esc_long = "Deselects a message or a range, drops the info (i), closes the preview (v) or the emoji picker,\nleaves a search (Ctrl+F), cancels an edit or a multiline paste."
help_esc_name = "Esc"
help_esc_short = "deselects, closes a panel, cancels"
help_f2_long = "One press lists the chats, a second one the open windows, a third one hides the panel.\nWith several networks, the windows mode walks the networks first (all, then each one) before hiding.\nClick: opens/joins; right click: menu (leave, report/block, delete, info, search).\nLast line of the list: “+ new message”, which opens the /new box.\nWheel over the panel: previous/next window in the panel's order, never opens one (click to open); hover = off puts list scrolling back."
help_f2_name = "F2"
help_f2_short = "side panel: chats, windows, hidden"
help_f3_long = "Peer and presence in a private chat, members (admins ★ first) in a group, subscribers in a channel.\nClick on a member: opens the chat with them; click on [x] at the top right: closes the box."
help_f3_name = "F3"
help_f3_short = "member box at the top right"
help_f4_long = "auto detects the kitty protocol, halfblock forces the half blocks, off turns them off.\nSame as: /set images <mode>."
help_f4_name = "F4"
help_f4_short = "cycles the image display mode"
help_f5_long = "The thread keeps no line free any more: the image shows on top when the mouse is over it.\nSame as: /set images_hover on."
help_f5_name = "F5"
help_f5_short = "shows the image only when the mouse is over the message"
help_f6_long = "Every message of every window scrolls there, prefixed with the chat name, like in BitchX.\n/query name or /join name pins the send target while the stream keeps updating; /q or /j alone closes that mode.\nWithout an explicit target, typing answers the chat of the last shown message. Same as: /set aggregate on."
help_f6_name = "F6"
help_f6_short = "switches window 0 to the aggregated view"
help_f7_long = "The status bar shows [sort:a→z]. The sort holds for both sidebar modes, chats and windows.\nSame as: /set sidebar_sort."
help_f7_name = "F7"
help_f7_short = "cycles the sidebar sort (recent, a→z, unread)"
help_fold_long = "With no argument, lists the sections and their state ([+] folded, [-] unfolded).\nA section is named by its key (telegram, discord, discord:Gophers) or by the name shown, a prefix being enough.\nSame as a click on the header line. The state is kept in sidebar.toml."
help_fold_name = "/fold [section]"
help_fold_short = "fold or unfold a section of the sidebar"
help_help_long = "With no argument: one line per command or key, grouped by section.\n/help <topic>: a command (query), a key (F3) or a /set key (hover). Alias: /h."
help_help_name = "/help [topic]"
help_help_short = "list of the commands, or the help of one topic"
help_history_long = "Not available in bot mode nor in a search window. PgUp at the top of the screen does the same."
help_history_name = "/history [N]"
help_history_short = "loads N older messages (50 by default)"
help_hover_long = "menu (alias on) highlights the message and shows its help line; highlight highlights without the help. The area under the pointer (panel, messages) lights up and takes the wheel; off gives the old behaviour back."
help_hover_name = "hover"
help_hover_short = "mouse hover: menu | highlight | off"
help_images_hover_long = "F5 toggles it."
help_images_hover_name = "images_hover"
help_images_hover_short = "image shown only when the mouse is over the message (on/off)"
help_images_long = "auto detects the kitty protocol. F4 cycles."
help_images_name = "images"
help_images_short = "image display mode: auto | kitty | halfblock | off"
help_join_long = "Takes a known name, @name or t.me/… link. Keeps the current feed visible and pins outgoing messages to that channel.\nWorks in every window, including aggregate window 0. /join or /j alone clears the target. Alias: /j."
help_join_name = "/join [channel]"
help_join_short = "joins a channel or group and sets it as the send target"
help_key_c_long = "OSC 52, with no timestamp and no indent."
help_key_c_name = "c"
help_key_c_short = "copies the text of the message (clipboard)"
help_key_d_long = "For everybody, after a confirmation (y/n)."
help_key_d_name = "d"
help_key_d_short = "deletes my selected message"
help_key_e_long = "Prompt ✎ #id ›, Enter sends, Esc cancels."
help_key_e_name = "e"
help_key_e_short = "edits my selected message"
help_key_i_long = "Esc drops these lines."
help_key_i_name = "i"
help_key_i_short = "info: date, read state, views, reactions"
help_key_l_long = "l again pauses. No sound."
help_key_l_name = "l"
help_key_l_short = "plays a downloaded video in the thread"
help_key_o_long = "On the selected message. Command form: /open N opens the Nth media from the end — /help open for the detail."
help_key_o_name = "o"
help_key_o_short = "opens the media of the message with xdg-open"
help_key_p_long = "Prompt ↩ #id ›, the quote shows under my reply."
help_key_p_name = "p"
help_key_p_short = "replies to the selected message"
help_key_r_long = "The picker offers only the reactions that Telegram and the room accept."
help_key_r_name = "r"
help_key_r_short = "reacts to the selected message"
help_key_s_long = ""
help_key_s_name = "s"
help_key_s_short = "goes back to the start of the video being played"
help_key_v_long = "Esc closes, o opens the file, c copies the image to the clipboard. +/- (or the wheel) zoom, 0 fits again, the arrows move the view."
help_key_v_name = "v"
help_key_v_short = "full screen preview of the media of the message"
help_kitty_images_long = "Above that, the one shown longest ago is freed and sent again the next time it shows."
help_kitty_images_name = "kitty_images"
help_kitty_images_short = "number of images kept in the terminal (LRU)"
help_lang_long = "Empty in config.toml: the language comes from $LC_ALL or $LANG ($LANG=fr_* gives fr, else en).\n/set lang fr or /set lang en changes the language at once and saves config.toml.\nA chain “fr+en” takes each text from the first language that has it, English staying the last resort."
help_lang_name = "lang"
help_lang_short = "interface language: fr, en, or a chain fr+en"
help_link_previews_long = "A │ block under the message: site, title, description, thumbnail."
help_link_previews_name = "link_previews"
help_link_previews_short = "preview of the links Telegram knows (on/off)"
help_log_dir_long = ""
help_log_dir_name = "log_dir"
help_log_dir_short = "directory of the window logs"
help_log_long = "Appends the lines of a window bound to a chat into <log_dir>/<title>-<network>-<id>.log, with a timestamp.\n[log] shows in the status bar. See /help log to log every new window."
help_log_name = "/log [on|off]"
help_log_opt_long = "/log per window forces the state one by one."
help_log_opt_name = "log"
help_log_opt_short = "log every new window by default (on/off)"
help_log_short = "logs the current window (toggle; on/off force it)"
help_maps_long = "4 tiles (zoom 15, red marker), cached in download_dir/maps.\nOff by default: each position asks tile.openstreetmap.org."
help_maps_name = "maps"
help_maps_short = "OpenStreetMap map under a shared position (off by default)"
help_me_long = ""
help_me_name = "/me <text>"
help_me_short = "sends an action in italics, like in ircii"
help_msg_long = "Alias: /m."
help_msg_name = "/msg <name> <text>"
help_msg_short = "sends a message without changing window"
help_net_long = "With no argument, cycles: every network, then each one in name order; Shift+F2 does the same cycle. /net all drops the filter.\nThe sidebar (F2) and the aggregated view then keep the chosen network only; a superscript letter in front of each title recalls the network of the chat.\nNo effect with a single network."
help_net_name = "/net [network]"
help_net_short = "filters the sidebar and the aggregated view on one network"
help_new_long = "Centred box: typing filters the known chats and the account contacts;\nafter three characters (or an @name), an “on Telegram” section adds the results\nof the Telegram search. Enter or a click opens the chat, Esc closes.\nSame box as the “+ new message” line at the foot of the sidebar (F2). Not available in bot mode."
help_new_name = "/new"
help_new_short = "opens “new chat” (or Ctrl+N)"
help_no_topic = "no help for “%s”"
help_notify_long = "terminal uses OSC 777 (Ghostty/kitty), desktop calls notify-send."
help_notify_name = "notify"
help_notify_short = "notification while away: terminal | desktop | off"
help_open_long = "With no argument, opens the last media of the window."
help_open_name = "/open [N]"
help_open_short = "opens the Nth media from the end (xdg-open)"
help_pgupdn_long = "PgUp at the top of the screen loads the previous history from the network. An image cut by the edge of the window shows its visible part; scrolled up, the pill ↓ last message brings back to the end on a click."
help_pgupdn_name = "PgUp/PgDn"
help_pgupdn_short = "scrolls the window"
help_query_long = "Pins outgoing messages to a contact or channel while keeping this window's feed visible, including aggregate window 0.\nThe prompt shows the target. New messages and window switches do not change it. /query or /q alone clears it.\nAliases: /q, /qu. Unique command prefixes also work without Tab. Use /new or the sidebar to open a conversation's own view."
help_query_name = "/query [name]"
help_query_short = "sets or clears this window's persistent send target (exact name or prefix)"
help_quit_long = ""
help_quit_name = "/quit"
help_quit_short = "leaves ttyloom (or Ctrl+C)"
help_redline_long = "Set right after the last read message when the window is entered; it does not move while it stays\nshown, and it is set again on the way back (other window or away). off: nothing."
help_redline_name = "redline"
help_redline_short = "red last-read line in each window (on/off)"
help_rename_long = "The local name replaces the Telegram title everywhere: sidebar, status bar, notifications,\n[chat] prefix of the aggregated view and peer name in a private chat. It never goes on the network.\n/rename <name> renames the chat of the current window; as soon as text follows the first word,\nthat word is a target (chat, @name or local name) and the command refuses if it points at nothing.\nA name or a target of several words goes between quotes:\n/rename \"mum in Paris\" · /rename \"Friends - Blabla\" Blabla. 64 cells at most.\nThe real title stays visible in /whois. Saved in aliases.toml."
help_rename_name = "/rename [target] <name>"
help_rename_short = "renames a chat locally"
help_search_long = "Up to 50 results, in a “?text” window bound to the same chat; /close closes it.\nNot available in bot mode."
help_search_name = "/search <text>"
help_search_short = "searches the whole Telegram history (server side)"
help_section_chats = "Chats"
help_section_input = "Input"
help_section_media = "Media"
help_section_messages = "Messages"
help_section_options = "Options"
help_section_sidebar = "Sidebar"
help_section_windows = "Windows"
help_send_long = "png/jpeg goes as a photo, the rest as a document. Tab completes the path (~ and spaces allowed, a directory gets its /). Ctrl+V sends an image from the clipboard right away."
help_send_name = "/send <path> [caption]"
help_send_short = "sends a local file (photo or document)"
help_separator_long = ""
help_separator_name = "separator"
help_separator_short = "─ line between the messages and the status bar (on/off)"
help_set_long = "/set alone shows every key; /set <key> shows its value; /set <key> <value> changes it\nand saves config.toml. Tab completes the keys then the values. See /help <key> for each option."
help_set_name = "/set [key [value]]"
help_set_short = "shows or changes an option on the fly"
help_shift_enter_long = "Alt+Enter does the same. Enter sends the message with its line breaks, Ctrl+Enter too;\na /… command stays on one line. Needs a terminal that speaks the kitty keyboard protocol\n(Ghostty, kitty, WezTerm, foot); elsewhere, a multiline paste is the way.\nWith /set multiline on, Shift+Enter opens the expanded input zone; Esc folds it back, the text kept."
help_shift_enter_name = "Shift+Enter"
help_shift_enter_short = "line break in the input, shown as ⏎"
help_shift_f2_long = "Same as /net with no argument: every network, then each one in name order.\nThe sidebar — chats as well as windows — and the aggregated view then keep the chosen network only.\nWith a single network: no effect and no line in the window."
help_shift_f2_name = "Shift+F2"
help_shift_f2_short = "cycles the network filter (like /net)"
help_spell_name = "spell"
help_spell_short = "input spell checking: off | fr | us | en_GB | fr+us…"
help_spell_long = "Mistakes in red in the input. Ctrl+R walks them (Enter fixes, i ignores, a adds to the personal dictionary, Ctrl+R skips, Esc leaves); right click on an underlined word to fix it alone. System hunspell dictionaries (hunspell-fr, hunspell-en-us packages): every dictionary of /usr/share/hunspell is accepted, Tab lists them."
help_spell_quotes_name = "spell_quotes"
help_spell_quotes_short = "on: also check the > quotes and the ``` fences"
help_spell_quotes_long = "off (default): the lines quoted with > and the ``` fences are not checked."
help_ctrl_r_name = "Ctrl+R"
help_ctrl_r_short = "walks the input mistakes"
help_ctrl_r_long = "Enter fixes with the chosen suggestion (↑/↓), i ignores for the session, a adds to the personal dictionary, Ctrl+R skips to the next word, Esc leaves. See /set spell."
help_sidebar_sort_long = "F7 cycles it."
help_sidebar_sort_name = "sidebar_sort"
help_sidebar_sort_short = "sidebar order: recent | alpha | unread"
help_sidebar_width_long = "The │ bar of the sidebar drags with the mouse: the width reached is saved."
help_sidebar_width_name = "sidebar_width"
help_sidebar_width_short = "sidebar width (12 up to half of the screen)"
help_theme_long = "/theme alone opens a filterable picker (↑/↓ live preview, Enter accepts, Esc restores).\n/theme list [filter] lists the themes. Tab completes the name."
help_theme_name = "/theme [name]"
help_theme_short = "theme picker, or /theme <name> applies one"
help_timestamps_long = ""
help_timestamps_name = "timestamps"
help_timestamps_short = "timestamp before each message (on/off)"
help_timestamps_seconds_long = ""
help_timestamps_seconds_name = "timestamps_seconds"
help_timestamps_seconds_short = "timestamps with the seconds, 15:04:05 (on/off)"
help_cycle_mode_long = "last_unread: Ctrl+X goes from one unread window to the next (number order), then back to the one left; with nothing unread, the classic cycle."
help_cycle_mode_name = "cycle_mode"
help_cycle_mode_short = "what Ctrl+X does: next | last_unread"
help_multiline_long = "Esc folds the expanded zone back, the draft kept; Enter sends and folds.\nA multiline paste in the expanded zone asks: insert as is or as a code block (```)."
help_multiline_name = "multiline"
help_multiline_short = "Shift+Enter opens the expanded input zone (on/off)"
help_try = " (try: %s)"
help_unrename_long = "With no argument: the chat of the current window. The Telegram title comes back everywhere.\nThe target can hold several words, with or without quotes."
help_unrename_name = "/unrename [target]"
help_unrename_short = "drops the local name of a chat"
help_video_long = "show keeps the historical behaviour: the first frame alone, the l key starts the play.\nhidden keeps no line free for videos: the label alone, the v preview and the o key still work.\nautoplay starts the play as soon as a downloaded video is decoded, and loops it; s stops it, l takes the lead back. The number of frames decoded stays bounded by video_inline_frames."
help_video_name = "video"
help_video_short = "inline video: show | hidden | autoplay"
