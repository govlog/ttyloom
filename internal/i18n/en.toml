help_mute_short = "no bell and no notification for a chat"
help_mute_long = "Mutes the chat of the window, or the chat named (exact name or prefix). A muted chat never rings the bell, never sends a notification (terminal or desktop) and never pulses in the sidebar, even on a mention; its unread count stays, dimmed, in its own line only (not in [Act: …] nor in the count of its tab). With no name in a window with no chat, lists the muted chats. Local to ttyloom (muted.toml, next to config.toml): the network is not told. /unmute undoes it."
