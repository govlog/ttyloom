help_alias_name = "/alias [name [text]]"
help_alias_short = "a command of your own: /name runs its text"
help_alias_long = "/alias name text sets an alias: /name then runs text, with what you type after /name appended (/alias ver /ctcp version, then /ver govlog runs /ctcp version govlog). A text that is no command is sent to the current chat as a message (/alias blop \"Blop !!!\"). Quotes around the text are dropped. /alias alone lists the aliases, /alias name shows one. The name of a command of ttyloom or of a module is refused. An alias runs the commands of ttyloom only, never another alias. Saved in commands.toml (0600, next to config.toml): an alias can hold a password. /unalias removes one."
