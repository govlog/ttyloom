help_media_long = "The photos and videos, the GIFs or the files of the conversation of the window, sent by anyone, newest first (Telegram, Discord). Up to six by four at a time; the wheel or the scrollbar shows the others, and the next ones load as you go. Tab and Shift+Tab, or a click on a tab, change tab. Enter or a click shows the media, ←/→ then go through the list (a file opens with its program); j goes to its message, o opens it, Esc closes. Only the GIF under the mouse plays. A cell shows the small picture the network gives, a small GIF itself, or the name, size, sender and date of a file; a media with no small picture downloads to download_dir like the ones of the conversation when it is under auto_media_max_kb."
