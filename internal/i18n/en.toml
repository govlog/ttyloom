fold_none = "no section to fold (a single network, no guild)"
fold_unknown = "unknown section: %s (available: %s)"
fwd_from = "↪ from %s"
gif_empty = "empty gif"
gsearch_bot_unavailable = "global search: not available in bot mode"
gsearch_count_many = "  (%d results)"
gsearch_count_one = "  (%d result)"
gsearch_head = "global search: %s"
gsearch_keys = "Enter open · Ctrl+F local search · Esc close"
help_aggregate_long = "Same as: F6."
help_aggregate_name = "aggregate"
help_aggregate_short = "aggregated window 0: every message, every window (on/off)"
help_alt_arrows_long = "In tab mode (F9) they stay inside the current tab and step over the windows of the other networks; window 0 is in every tab."
help_alt_arrows_name = "Alt+←/→"
help_alt_arrows_short = "previous window, next window"
help_alt_digits_long = "Some desktops take Alt+key combinations before the terminal: /5 or /win 5 does the same."
help_alt_digits_name = "Alt+1..9"
help_alt_digits_short = "goes straight to window 1 to 9 (Alt+0: window 0)"
help_alt_updown_long = "The block is highlighted; the keys below act on it. A click on a message does the same, a right click opens its menu."
help_ctrl_updown_long = "From an empty input Ctrl+↑ edits my last message, each Ctrl+↑ then goes one message of mine up, Ctrl+↓ one down; past the newest the edit is left."
help_ctrl_updown_name = "Ctrl+↑/↓"
help_ctrl_updown_short = "edits my previous message, the next one"
help_msg_menu_long = "Quick reactions on the first row, then the actions of the message (go to the quoted message, reply, react, copy, info, open, view, play, edit, delete). The entry under the pointer is the current one; Enter or a click runs it, any other key closes."
help_msg_menu_name = "right click"
help_msg_menu_short = "context menu of the message under the pointer"
help_alt_updown_name = "Alt+↑/↓"
help_alt_updown_short = "selects the previous message, the next one"
help_auto_media_max_kb_long = "Above that, the media stays a label: v, o, /open or a click download it on demand. 0: no media downloads on its own. 524288 at most."
help_auto_media_max_kb_name = "auto_media_max_kb"
help_auto_media_max_kb_short = "max size (KB) of a media downloaded on its own"
help_auto_open_days_long = ""
help_auto_open_days_name = "auto_open_days"
help_auto_open_days_short = "hidden windows opened at start (days of activity, 0 = never)"
help_avatars_long = ""
help_avatars_name = "avatars"
help_avatars_short = "profile photos before the names and in the sidebar, in kitty (on/off)"
help_away_long = "On the all tab, or with no tab, every network that supports it; on a network tab (or after /net), that network only. IRC sends AWAY, Discord goes idle with the message as custom status (experimental), Telegram has no equivalent. Nothing is said in the rooms."
help_away_name = "/away [message]"
help_away_short = "marks me away with a message on the networks that can (IRC, Discord); /away alone comes back"
help_bell_long = "Rings for a window that is not shown, or for any window while the terminal is not focused. A burst rings once, then once more for the last message 2 s later. A muted chat (/mute) never rings."
help_bell_name = "bell"
help_bell_short = "terminal bell on a private message or a mention (on/off)"
help_cache_messages_long = "The disk cache follows at the next start; the memory of the windows at once, never under 2000 messages."
help_cache_messages_name = "cache_messages"
help_cache_messages_short = "messages kept per chat on disk"
help_chats_long = "Not available in bot mode."
help_chats_name = "/chats"
help_chats_short = "lists the chats (unread ones highlighted)"
help_clear_long = "Nothing is deleted on the network side, nor in the disk cache. Ctrl+L only clears the screen. Alias: /c."
help_clear_name = "/clear"
help_clear_short = "empties the current window"
help_close_long = "Same as /window close."
help_close_name = "/close"
help_close_short = "closes the current window (never window 0)"
help_ctrl_ae_long = ""
help_ctrl_ae_name = "Ctrl+A/E"
help_ctrl_ae_short = "start, end of the input line"
help_ctrl_biu_long = "Each key toggles its style at the cursor: what follows takes it until the same key comes again, and the styles stack (Ctrl+U then Ctrl+I: underline+italic). The status bar shows the styles open at the cursor; Backspace on a toggle takes it back. Ctrl+I needs the kitty keyboard protocol (Ghostty, kitty, WezTerm, foot): elsewhere it is Tab. Ctrl+K still deletes to the end of the line."
help_ctrl_biu_name = "Ctrl+B/I/U"
help_ctrl_biu_short = "bold, italic, underline of the draft"
help_ctrl_c_long = "Same as: /quit."
help_ctrl_c_name = "Ctrl+C"
help_ctrl_c_short = "leaves ttyloom"
help_ctrl_f_long = "Typing searches live, without case nor accents, hits highlighted.\nEnter goes up to the previous hit, Ctrl+N goes down, Esc leaves.\nA 2nd Ctrl+F sends the query to every network that searches (Telegram, Discord; the /net filter limits them) and opens\nthe result list: ↑/↓, wheel, Enter or a click opens the chat at the message.\nTyping there changes the query, a 3rd Ctrl+F comes back to the local one, Esc closes. The global search is not available in bot mode."
help_ctrl_f_name = "Ctrl+F"
help_ctrl_f_short = "searches the window, then the server"
help_ctrl_l_long = "Like the clear of a terminal: the lines stay in the window and in the history, PgUp or the wheel shows them again. /clear drops them."
help_ctrl_l_name = "Ctrl+L"
help_ctrl_l_short = "clears the window; PgUp brings the lines back"
help_ctrl_n_long = "Same as /new. During a Ctrl+F search, Ctrl+N goes to the next hit."
help_ctrl_n_name = "Ctrl+N"
help_ctrl_n_short = "opens “new chat”"
help_ctrl_t_long = "Same as: /emoji."
help_ctrl_t_name = "Ctrl+T"
help_ctrl_t_short = "opens the emoji picker"
help_ctrl_v_long = "An image (wl-paste or xclip) offers (e) send, (l) caption, (a) cancel. Text goes into the input line."
help_ctrl_v_name = "Ctrl+V"
help_ctrl_v_short = "pastes an image from the clipboard, or text"
help_ctrl_x_long = "In tab mode (F9) the cycle stays inside the current tab."
help_ctrl_x_name = "Ctrl+X"
help_ctrl_x_short = "next window (cycles back to 0); /set cycle_mode last_unread: the unread windows in turn, then back"
help_debug_long = "The warnings (WARN) of the networks show only there; the errors (ERROR)\nalso stay in window 0. Nothing is written to disk."
help_debug_name = "/debug"
help_debug_short = "switches the internal log in place of window 0"
help_download_dir_long = ""
help_download_dir_name = "download_dir"
help_download_dir_short = "directory of the downloaded media"
help_emoji_long = "Typing filters, the arrows or a click choose, Enter inserts, Esc closes."
help_emoji_name = "/emoji"
help_emoji_short = "emoji picker (or Ctrl+T)"
help_esc_long = "Deselects a message or a range, drops the info (i), closes the preview (v) or the emoji picker,\nleaves a search (Ctrl+F), cancels an edit or a multiline paste, folds the expanded input, drops the Tab listings."
help_esc_name = "Esc"
help_esc_short = "deselects, closes a panel, cancels"
help_f2_long = "One press lists the chats, a second one the open windows, a third one hides the panel.\nWith several networks, the windows mode walks the networks first (all, then each one) before hiding.\nClick: opens/joins; right click: menu (leave, report/block, delete, info, search).\nLast line of the list: “+ new message”, which opens the /new box.\nWheel over the panel: previous/next window in the panel's order, never opens one (click to open); hover = off puts list scrolling back.\nTyping with the pointer over the panel, or after Shift+Tab, filters the list (case and accents apart); ↑/↓ move the cursor, Enter opens the line and gives the keyboard back to the input line, Escape or the wheel drops the filter. Shift+Tab also takes the keyboard back."
help_f2_name = "F2"
help_f2_short = "side panel: chats, windows, hidden"
help_f3_long = "Peer and presence in a private chat, members (admins ★ first) in a group, subscribers in a channel, ops (@) and voices (+) in an IRC room; members online in colour.\nClick on a member: opens the chat with them; right click: their menu; click on [x] at the top right: closes the box."
help_f3_name = "F3"
help_f3_short = "member box at the top right"
help_f4_long = "Cycles kitty → halfblock → off (halfblock ↔ off without kitty graphics) and saves the mode.\n/set images auto|kitty|halfblock|off chooses one; auto detects the kitty protocol."
help_f4_name = "F4"
help_f4_short = "cycles the image display mode"
help_f5_long = "The thread keeps no line free any more: the image shows on top when the mouse is over it.\nSame as: /set images_hover on."
help_f5_name = "F5"
help_f5_short = "shows the image only when the mouse is over the message"
help_f6_long = "Every message of every window scrolls there, prefixed with the chat name, like in BitchX.\n/query name or /join name pins the send target while the stream keeps updating; /q or /j alone closes that mode.\nWithout an explicit target, typing answers the chat of the last shown message. Same as: /set aggregate on."
help_f6_name = "F6"
help_f6_short = "switches window 0 to the aggregated view"
help_f7_long = "The header of the sidebar shows the order (Windows [a→z]) and answers a click like F7. The sort holds for both sidebar modes, chats and windows.\nSame as: /set sidebar_sort."
help_f7_name = "F7"
help_f7_short = "cycles the sidebar sort (recent, a→z, unread)"
help_f9_long = "Turns the tabs on (tabs = true) and cycles all → each network → all. A network tab shows only its windows: Ctrl+X and Alt+←/→ stay inside it, the sidebar and the aggregate are cut to it, the other tabs carry their unread count. Alt+N and /win N still reach any window: the tab follows. Same filter as /net and Shift+F2."
help_f9_name = "F9"
help_f9_short = "tab mode: one tab per network, F9 or a click switches"
help_fold_long = "With no argument, lists the sections and their state ([+] folded, [-] unfolded).\nA section is named by its key (telegram, discord, discord:Gophers) or by the name shown, a prefix being enough.\nSame as a click on the header line. The state is kept in sidebar.toml."
help_fold_name = "/fold [section]"
help_fold_short = "fold or unfold a section of the sidebar"
help_help_long = "With no argument: one line per command or key, grouped by section.\n/help <topic>: a command (query), a key (F3) or a /set key (hover). Alias: /h."
help_help_name = "/help [topic]"
help_help_short = "list of the commands, or the help of one topic"
help_history_long = "At most what a window keeps (2000 messages, or cache_messages when higher). Not available in bot mode nor in a search window. PgUp at the top of the screen does the same."
help_history_name = "/history [N]"
help_history_short = "loads N older messages (50 by default)"
help_hover_long = "menu (alias on) and highlight both highlight the message under the pointer. The area under the pointer (panel, messages) lights up and takes the wheel; off gives the old behaviour back."
help_hover_name = "hover"
help_hover_short = "mouse hover: menu | highlight | off"
help_images_hover_long = "F5 toggles it."
help_images_hover_name = "images_hover"
help_images_hover_short = "image shown only when the mouse is over the message (on/off)"
help_images_long = "auto detects the kitty protocol. F4 cycles."
help_images_name = "images"
help_images_short = "image display mode: auto | kitty | halfblock | off"
help_join_long = "Takes a known name, @name, t.me/… link or IRC #room — /join #room key gives the channel key of a room in mode +k, saved with it. Keeps the current feed visible and pins outgoing messages to that channel.\nWorks in every window, including aggregate window 0. /join or /j alone clears the target. Alias: /j."
help_join_name = "/join [channel] [key]"
help_join_short = "joins a channel or group and sets it as the send target"
help_key_c_long = "OSC 52, with no timestamp and no indent."
help_key_c_name = "c"
help_key_c_short = "copies the text of the message (clipboard)"
help_key_d_long = "For everybody, after a confirmation (y/n)."
help_key_d_name = "d"
help_key_d_short = "deletes my selected message"
help_key_e_long = "Prompt ✎ #id ›, Enter sends, Esc cancels."
help_key_e_name = "e"
help_key_e_short = "edits my selected message"
help_key_g_long = "On a message that quotes another one, g goes to the message quoted; in a /search window, it opens the real chat at the selected result. A click on the quote does the same. The history missing between the two is loaded, and a “… messages not loaded” line marks the gap until a page fills it."
help_key_g_name = "g"
help_key_g_short = "jumps to the quoted message, or from a search result to its chat"
help_key_i_long = "Esc drops these lines."
help_key_i_name = "i"
help_key_i_short = "info: date, read state, views, reactions"
help_key_l_long = "l again pauses. No sound; needs ffmpeg."
help_key_l_name = "l"
help_key_l_short = "plays a downloaded video in the thread"
help_key_o_long = "On the selected message; a link preview asks before it opens the page. Command form: /open N opens the Nth media from the end — /help open for the detail."
help_key_o_name = "o"
help_key_o_short = "opens the media of the message with xdg-open"
help_key_p_long = "Prompt ↩ #id ›, the quote shows under my reply."
help_key_p_name = "p"
help_key_p_short = "replies to the selected message"
help_key_r_long = "Telegram: the picker offers only the reactions the chat accepts. Discord: any emoji, the custom ones of the server first (:name:). The same choice again removes it."
help_key_r_name = "r"
help_key_r_short = "reacts to the selected message"
help_key_s_long = ""
help_key_s_name = "s"
help_key_s_short = "goes back to the start of the video being played"
help_key_v_long = "Esc closes, o opens the file, c copies the image to the clipboard. ←/→ show the media before and after (in the window, or in the media browser it was opened from). +/- (or the wheel) zoom, 0 fits again, ↑/↓ and Shift+←/→ move the view."
help_key_v_name = "v"
help_key_v_short = "full screen preview of the media of the message"
help_kitty_images_long = "Above that, the one shown longest ago is freed and sent again the next time it shows."
help_kitty_images_name = "kitty_images"
help_kitty_images_short = "number of images kept in the terminal (LRU)"
help_lang_long = "Empty in config.toml: the language comes from $LC_ALL, $LC_MESSAGES or $LANG, the first one set (fr… gives fr, else en).\n/set lang fr or /set lang en changes the language at once and saves config.toml.\nA chain “fr+en” takes each text from the first language that has it, English staying the last resort."
help_lang_name = "lang"
help_lang_short = "interface language: fr, en, or a chain fr+en"
help_link_previews_long = "A │ block under the message: site, title, description and thumbnail on Telegram; title and description on Discord. off: the label alone."
help_link_previews_name = "link_previews"
help_link_previews_short = "preview of the links: Telegram, Discord embeds (on/off)"
help_log_dir_long = ""
help_log_dir_name = "log_dir"
help_log_dir_short = "directory of the window logs"
help_log_long = "Appends the lines of a window bound to a chat into <log_dir>/<title>-<network>-<id>.log, with a timestamp.\n[log] shows in the status bar. /set log on logs every new window."
help_log_name = "/log [on|off]"
help_log_opt_long = "/log per window forces the state one by one."
help_log_opt_name = "log"
help_log_opt_short = "log every new window by default (on/off)"
help_log_short = "logs the current window (toggle; on/off force it)"
help_maps_long = "4 tiles (zoom 15, red marker): the map goes to download_dir/maps, the tiles to the cache directory.\nOff by default: each position asks tile.openstreetmap.org."
help_maps_name = "maps"
help_maps_short = "OpenStreetMap map under a shared position (off by default)"
help_me_long = "On IRC it goes out as a CTCP ACTION and shows as * nick text; elsewhere as a message in italics. The Ctrl+B/U styles are kept."
help_me_name = "/me <text>"
help_me_short = "sends an action in italics, like in ircii"
help_shrug_long = "/shrugs does the same."
help_shrug_name = "/shrug [text]"
help_shrug_short = "sends the text followed by ¯\\_(ツ)_/¯"
help_msg_long = "The name is an exact chat name or a unique prefix, never a word inside a name; a whole title of several words works (Tab puts it). The line is echoed here as [msg(name)] text. Alias: /m."
help_msg_name = "/msg <name> <text>"
help_msg_short = "sends a message without changing window"
help_net_long = "With no argument, cycles: every network, then each one in name order; Shift+F2 does the same cycle. /net all drops the filter.\nThe sidebar (F2) and the aggregated view then keep the chosen network only; a superscript letter in front of each title recalls the network of the chat.\nNo effect with a single network."
help_net_name = "/net [network]"
help_net_short = "filters the sidebar and the aggregated view on one network"
help_new_long = "Centred box: typing filters the known chats and the account contacts;\nafter three characters (or an @name), an “on Telegram” section adds the results\nof the Telegram search. Enter or a click opens the chat, Esc closes.\nSame box as the “+ new message” line at the foot of the sidebar (F2). Not available in bot mode."
help_new_name = "/new"
help_new_short = "opens “new chat” (or Ctrl+N)"
help_no_topic = "no help for “%s”"
help_notify_long = "terminal uses OSC 777 (Ghostty/kitty), desktop calls notify-send. Same rule as the bell: a window not shown, or the terminal not focused; a burst gives one at once, then one for the last message 2 s later; a muted chat never notifies."
help_notify_name = "notify"
help_notify_short = "notification on a private message or a mention: terminal | desktop | off"
help_open_long = "With no argument, opens the last media of the window."
help_open_name = "/open [N]"
help_open_short = "opens the Nth media from the end (xdg-open)"
help_pgupdn_long = "PgUp at the top of the screen loads the previous history from the network. An image cut by the edge of the window shows its visible part; scrolled up, the pill ↓ last message brings back to the end on a click."
help_pgupdn_name = "PgUp/PgDn"
help_pgupdn_short = "scrolls the window"
help_query_long = "Pins outgoing messages to a contact or channel while keeping this window's feed visible, including aggregate window 0.\nThe prompt shows the target. New messages and window switches do not change it. /query or /q alone clears it.\nAliases: /q, /qu. Unique command prefixes also work without Tab. Use /new or the sidebar to open a conversation's own view."
help_query_name = "/query [name]"
help_query_short = "sets or clears this window's persistent send target (exact name or prefix)"
help_quit_long = ""
help_quit_name = "/quit"
help_quit_short = "leaves ttyloom (or Ctrl+C)"
help_redline_long = "Set right after the last read message when the window is entered; it does not move while it stays\nshown, and it is set again on the way back (other window or away). off: nothing."
help_redline_name = "redline"
help_redline_short = "red last-read line in each window (on/off)"
help_rename_long = "The local name replaces the title of the network everywhere: sidebar, status bar, notifications,\n[chat] prefix of the aggregated view and peer name in a private chat. It never goes on the network.\n/rename <name> renames the chat of the current window; as soon as text follows the first word,\nthat word is a target (chat, @name or local name) and the command refuses if it points at nothing.\nA name or a target of several words goes between quotes:\n/rename \"mum in Paris\" · /rename \"Friends - Blabla\" Blabla. 64 cells at most.\nThe real title stays visible in /whois. Saved in aliases.toml."
help_rename_name = "/rename [target] <name>"
help_rename_short = "renames a chat locally"
help_search_long = "Up to 50 results, in a “?text” window bound to the same chat; Enter or g on a result opens the real chat at that message; /close closes it.\nNot available in bot mode."
help_search_name = "/search <text>"
help_search_short = "searches the history of the chat on the server (Telegram, Discord)"
help_section_chats = "Chats"
help_section_input = "Input"
help_section_media = "Media"
help_section_messages = "Messages"
help_section_options = "Options"
help_section_sidebar = "Sidebar"
help_section_windows = "Windows"
help_send_long = "On Telegram png/jpeg goes as a photo, a video or a sound file with its ffprobe metadata, the rest as a document; on Discord as an attachment; in a private IRC chat by DCC SEND. 2 GB at most. Tab completes the path (~ and spaces allowed, a directory gets its /). Ctrl+V pastes an image from the clipboard and asks before sending it."
help_send_name = "/send <path> [caption]"
help_send_short = "sends a local file (photo, video, document)"
help_separator_long = ""
help_separator_name = "separator"
help_separator_short = "─ line between the messages and the status bar (on/off)"
help_set_long = "/set alone shows every key; /set <key> shows its value; /set <key> <value> changes it\nand saves config.toml. Tab completes the keys then the values. See /help <key> for each option."
help_set_name = "/set [key [value]]"
help_set_short = "shows or changes an option on the fly"
help_shift_enter_long = "Alt+Enter does the same. Enter sends the message with its line breaks, Ctrl+Enter too;\na /… command stays on one line. Needs a terminal that speaks the kitty keyboard protocol\n(Ghostty, kitty, WezTerm, foot); elsewhere, a multiline paste is the way.\nWith /set multiline on, Shift+Enter opens the expanded input zone; Esc folds it back, the text kept."
help_shift_enter_name = "Shift+Enter"
help_shift_enter_short = "line break in the input, shown as ⏎"
help_shift_f2_long = "Same as /net with no argument: every network, then each one in name order.\nThe sidebar — chats as well as windows — and the aggregated view then keep the chosen network only.\nWith a single network: no effect and no line in the window."
help_shift_f2_name = "Shift+F2"
help_shift_f2_short = "cycles the network filter (like /net)"
help_spell_name = "spell"
help_spell_short = "input spell checking: off | fr | us | en_GB | fr+us…"
