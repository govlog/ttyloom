help_update_check_long = "Off by default: ttyloom makes no request. On, it asks the GitHub API (api.github.com) at each start, in the background, for the newest release; window 0 says when it is newer than this build. A release build compares versions; a build from source compares the date of its commit with the release. /set update_check on checks at once. The build id is the first 8 hex digits of the source commit (ttyloom --version)."
