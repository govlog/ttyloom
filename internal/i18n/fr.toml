help_alias_short = "une commande à vous : /nom exécute son texte"
help_alias_long = "/alias nom texte crée un alias : /nom exécute alors le texte, suivi de ce que vous tapez après /nom (/alias ver /ctcp version, puis /ver govlog exécute /ctcp version govlog). Un texte qui n'est pas une commande part comme message dans la conversation courante (/alias blop \"Blop !!!\"). Les guillemets autour du texte sont retirés. /alias seul liste les alias, /alias nom en montre un. Le nom d'une commande de ttyloom ou d'un module est refusé. Un alias n'exécute que les commandes de ttyloom, jamais un autre alias. Enregistré dans commands.toml (0600, à côté de config.toml) : un alias peut contenir un mot de passe. /unalias en retire un."
