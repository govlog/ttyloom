help_update_check_name = "update_check"
help_update_check_short = "demande à GitHub au démarrage si une version plus récente existe (on/off, off par défaut)"
help_update_check_long = "Désactivé par défaut : ttyloom ne fait aucune requête. Activé, il demande à l'API GitHub (api.github.com) à chaque démarrage, en arrière-plan, la dernière version publiée ; la fenêtre 0 l'annonce si elle est plus récente que ce build. Un binaire publié compare les versions ; un build depuis les sources compare la date de son commit à celle de la version. /set update_check on vérifie tout de suite. L'id de build est formé des 8 premiers chiffres hexadécimaux du commit source (ttyloom --version)."
