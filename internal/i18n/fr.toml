help_alt_arrows_long = "En mode onglets (F9) elles restent dans l'onglet courant et passent par-dessus les fenêtres des autres réseaux ; la fenêtre 0 est dans tous les onglets."
help_alt_arrows_name = "Alt+←/→"
help_alt_arrows_short = "fenêtre précédente, suivante"
help_alt_digits_long = "Certains environnements de bureau capturent les combinaisons Alt+touche avant le terminal : /5 ou /win 5 fait de même."
help_alt_digits_name = "Alt+1..9"
help_alt_digits_short = "va directement à la fenêtre 1 à 9 (Alt+0 : fenêtre 0)"
help_alt_updown_long = "Le bloc passe en surbrillance ; les touches ci-dessous agissent dessus. Un clic sur un message fait de même, un clic droit ouvre son menu."
help_ctrl_updown_long = "Depuis une saisie vide, Ctrl+↑ édite mon dernier message ; chaque Ctrl+↑ remonte ensuite d'un message à moi, Ctrl+↓ redescend ; au-delà du plus récent l'édition est quittée."
help_ctrl_updown_name = "Ctrl+↑/↓"
help_ctrl_updown_short = "édite mon message précédent, suivant"
help_msg_menu_long = "Réactions rapides sur la première ligne, puis les actions du message (aller au message cité, répondre, réagir, copier, infos, ouvrir, voir, lire, éditer, supprimer). L'entrée sous le pointeur devient la courante ; Entrée ou un clic l'exécute, toute autre touche ferme."
help_msg_menu_name = "clic droit"
help_msg_menu_short = "menu contextuel du message sous le pointeur"
help_alt_updown_name = "Alt+↑/↓"
help_alt_updown_short = "sélectionne le message précédent, suivant"
help_auto_media_max_kb_long = "Au-delà, le média reste une étiquette : v, o, /open ou un clic le téléchargent à la demande. 0 : aucun média ne se télécharge tout seul. 524288 au plus."
help_auto_media_max_kb_name = "auto_media_max_kb"
help_auto_media_max_kb_short = "taille max (Ko) d'un média téléchargé automatiquement"
help_auto_open_days_long = ""
help_auto_open_days_name = "auto_open_days"
help_auto_open_days_short = "fenêtres cachées ouvertes au démarrage (jours d'activité, 0 = jamais)"
help_avatars_long = ""
help_avatars_name = "avatars"
help_avatars_short = "photos de profil devant les pseudos et dans le panneau, en kitty (on/off)"
help_away_long = "Sur l'onglet all, ou sans onglet, tous les réseaux qui le gèrent ; sur un onglet de réseau (ou après /net), ce réseau seul. IRC envoie AWAY, Discord passe en inactif avec le message en statut personnalisé (expérimental), Telegram n'a pas d'équivalent. Rien n'est dit dans les salons."
help_away_name = "/away [message]"
help_away_short = "me marque absent avec un message sur les réseaux qui le savent faire (IRC, Discord) ; /away seul fait revenir"
help_bell_long = "Sonne pour une fenêtre non affichée, ou pour toute fenêtre quand le terminal n'a pas le focus. Une rafale sonne une fois, puis une fois encore pour le dernier message 2 s plus tard. Une conversation en sourdine (/mute) ne sonne jamais."
help_bell_name = "bell"
help_bell_short = "cloche du terminal sur message privé ou mention (on/off)"
help_cache_messages_long = "Le cache disque suit au prochain démarrage ; la mémoire des fenêtres tout de suite, jamais sous 2000 messages."
help_cache_messages_name = "cache_messages"
help_cache_messages_short = "messages gardés par conversation sur disque"
help_chats_long = "Indisponible en mode bot."
help_chats_name = "/chats"
help_chats_short = "liste les conversations (non lues en surbrillance)"
help_clear_long = "Rien n'est supprimé côté réseau, ni dans le cache disque. Ctrl+L ne fait qu'effacer l'écran. Alias : /c."
help_clear_name = "/clear"
help_clear_short = "vide la fenêtre courante"
help_close_long = "Équivalent de /window close."
help_close_name = "/close"
help_close_short = "ferme la fenêtre courante (jamais la 0)"
help_ctrl_ae_long = ""
help_ctrl_ae_name = "Ctrl+A/E"
help_ctrl_ae_short = "début, fin de la ligne de saisie"
help_ctrl_biu_long = "Chaque touche bascule son style au curseur : ce qui suit le prend jusqu'à la même touche, et les styles se cumulent (Ctrl+U puis Ctrl+I : souligné+italique). La barre d'état montre les styles ouverts au curseur ; Retour arrière sur une bascule l'annule. Ctrl+I demande le protocole clavier kitty (Ghostty, kitty, WezTerm, foot) : ailleurs c'est Tab. Ctrl+K supprime toujours jusqu'à la fin de la ligne."
help_ctrl_biu_name = "Ctrl+B/I/U"
help_ctrl_biu_short = "gras, italique, souligné dans la saisie"
help_ctrl_c_long = "Équivalent : /quit."
help_ctrl_c_name = "Ctrl+C"
help_ctrl_c_short = "quitte ttyloom"
help_ctrl_f_long = "La frappe cherche en direct, sans casse ni accents, occurrences surlignées.\nEntrée remonte à l'occurrence précédente, Ctrl+N descend, Échap quitte.\nUn 2e Ctrl+F envoie la requête à chaque réseau qui sait chercher (Telegram, Discord ; le filtre /net les limite) et ouvre\nla liste des résultats : ↑/↓, molette, Entrée ou clic ouvre la conversation au message.\nLa frappe y modifie la requête, un 3e Ctrl+F revient au local, Échap ferme. La recherche globale est indisponible en mode bot."
help_ctrl_f_name = "Ctrl+F"
help_ctrl_f_short = "cherche dans la fenêtre, puis sur le serveur"
help_ctrl_l_long = "Comme le clear d'un terminal : les lignes restent dans la fenêtre et dans l'historique, Page haut ou la molette les remontre. /clear les supprime."
help_ctrl_l_name = "Ctrl+L"
help_ctrl_l_short = "vide la fenêtre ; Page haut ramène les lignes"
help_ctrl_n_long = "Équivalent de /new. Pendant une recherche Ctrl+F, Ctrl+N va à l'occurrence suivante."
help_ctrl_n_name = "Ctrl+N"
help_ctrl_n_short = "ouvre « nouvelle conversation »"
help_ctrl_t_long = "Équivalent : /emoji."
help_ctrl_t_name = "Ctrl+T"
help_ctrl_t_short = "ouvre le sélecteur d'emoji"
help_ctrl_v_long = "Une image (wl-paste ou xclip) propose (e) envoyer, (l) légende, (a) annuler. Du texte va dans la saisie."
help_ctrl_v_name = "Ctrl+V"
help_ctrl_v_short = "colle une image du presse-papier, ou du texte"
help_ctrl_x_long = "En mode onglets (F9) le cycle reste dans l'onglet courant."
help_ctrl_x_name = "Ctrl+X"
help_ctrl_x_short = "fenêtre suivante (cycle, revient à 0) ; /set cycle_mode last_unread : les fenêtres non lues l'une après l'autre, puis retour"
help_debug_long = "Les avertissements (WARN) des réseaux n'apparaissent que là ; les erreurs (ERROR)\nrestent aussi en fenêtre 0. Rien n'est écrit sur disque."
help_debug_name = "/debug"
help_debug_short = "bascule le journal interne à la place de la fenêtre 0"
help_download_dir_long = ""
help_download_dir_name = "download_dir"
help_download_dir_short = "répertoire des médias téléchargés"
help_emoji_long = "La frappe filtre, les flèches ou un clic choisissent, Entrée insère, Échap ferme."
help_emoji_name = "/emoji"
help_emoji_short = "sélecteur d'emoji (ou Ctrl+T)"
help_esc_long = "Désélectionne un message ou une plage, retire les infos (i), ferme l'aperçu (v) ou le sélecteur\nd'emoji, quitte une recherche (Ctrl+F), annule une édition ou un collage multi-lignes, replie la saisie étendue, retire les listes de Tab."
help_esc_name = "Échap"
help_esc_short = "désélectionne, ferme un panneau, annule"
help_f2_long = "Une pression liste les conversations, une deuxième les fenêtres ouvertes, une troisième masque.\nAvec plusieurs réseaux, le mode fenêtres enchaîne d'abord les réseaux (tous, puis chacun) avant de masquer.\nClic : ouvre/rejoint ; clic droit : menu (quitter, signaler/bloquer, supprimer, infos, rechercher).\nDernière ligne de la liste : « + nouveau message », qui ouvre la boîte de /new.\nMolette au-dessus du panneau : fenêtre précédente/suivante dans l'ordre du panneau, sans jamais en ouvrir une nouvelle (clic pour ouvrir) ; hover = off la remet en défilement de liste.\nTaper avec le pointeur sur le panneau, ou après Maj+Tab, filtre la liste (sans tenir compte de la casse ni des accents) ; ↑/↓ déplacent le curseur, Entrée ouvre la ligne et rend le clavier à la saisie, Échap ou la molette efface le filtre. Maj+Tab reprend aussi le clavier."
help_f2_name = "F2"
help_f2_short = "panneau latéral : conversations, fenêtres, caché"
help_f3_long = "Pair et présence en privé, membres (admins ★ en tête) en groupe, abonnés en canal, ops (@) et voix (+) dans un salon IRC ; les membres en ligne en couleur.\nClic sur un membre : ouvre sa conversation ; clic droit : son menu ; clic sur [x] en haut à droite : ferme la boîte."
help_f3_name = "F3"
help_f3_short = "boîte des participants en haut à droite"
help_f4_long = "Enchaîne kitty → halfblock → off (halfblock ↔ off sans kitty graphics) et enregistre le mode.\n/set images auto|kitty|halfblock|off en choisit un ; auto détecte le protocole kitty."
help_f4_name = "F4"
help_f4_short = "cycle le mode d'affichage des images"
help_f5_long = "Le fil ne réserve plus de ligne : l'image apparaît en surimpression au survol.\nÉquivalent : /set images_hover on."
help_f5_name = "F5"
help_f5_short = "affiche l'image seulement au survol du message"
help_f6_long = "Tous les messages de toutes les fenêtres y défilent, préfixés du nom de la conversation, comme sous BitchX.\n/query nom ou /join nom fixe la cible d'envoi pendant que le flux continue ; /q ou /j seul ferme ce mode.\nSans cible explicite, la saisie répond à la conversation du dernier message affiché. Équivalent : /set aggregate on."
help_f6_name = "F6"
help_f6_short = "bascule la fenêtre 0 en vue agrégée"
help_f7_long = "L'en-tête du panneau affiche le tri (Fenêtres [a→z]) et répond au clic comme F7. Le tri vaut pour les deux modes du panneau, conversations et fenêtres.\nÉquivalent : /set sidebar_sort."
help_f7_name = "F7"
help_f7_short = "cycle le tri du panneau (récents, a→z, non-lus)"
help_f9_long = "Active les onglets (tabs = true) et enchaîne all → chaque réseau → all. Un onglet réseau ne montre que ses fenêtres : Ctrl+X et Alt+←/→ y restent, le panneau et l'agrégé sont coupés à lui, les autres onglets portent leur compteur de non-lus. Alt+N et /win N atteignent toujours n'importe quelle fenêtre : l'onglet suit. Même filtre que /net et Maj+F2."
help_f9_name = "F9"
help_f9_short = "mode onglets : un onglet par réseau, F9 ou un clic change"
help_fold_long = "Sans argument, liste les sections et leur état ([+] pliée, [-] dépliée).\nLa section se nomme par sa clé (telegram, discord, discord:Gophers) ou par le nom affiché, un préfixe suffit.\nMême effet qu'un clic sur la ligne d'en-tête. L'état est gardé dans sidebar.toml."
help_fold_name = "/fold [section]"
help_fold_short = "plier ou déplier une section du panneau"
help_help_long = "Sans argument : une ligne par commande ou touche, groupées par section.\n/help <sujet> : une commande (query), une touche (F3) ou une clé /set (hover). Alias : /h."
help_help_name = "/help [sujet]"
help_help_short = "liste des commandes, ou l'aide d'un sujet"
help_history_long = "Au plus ce que garde une fenêtre (2000 messages, ou cache_messages s'il est plus grand). Indisponible en mode bot et dans une fenêtre de recherche. PgUp en haut de l'écran fait de même."
help_history_name = "/history [N]"
help_history_short = "charge N messages plus anciens (défaut 50)"
help_hover_long = "menu (alias on) et highlight surlignent tous deux le message sous le pointeur. La zone sous le pointeur (panneau, messages) s'éclaire et prend la molette ; off rend le comportement d'avant."
help_hover_name = "hover"
help_hover_short = "survol souris : menu | highlight | off"
help_images_hover_long = "F5 bascule."
help_images_hover_name = "images_hover"
help_images_hover_short = "image affichée seulement au survol du message (on/off)"
help_images_long = "auto détecte le protocole kitty. F4 cycle."
help_images_name = "images"
help_images_short = "mode d'affichage des images : auto | kitty | halfblock | off"
help_join_long = "Accepte un nom connu, @nom, lien t.me/… ou #salon IRC — /join #salon clé donne la clé d'un salon en mode +k, enregistrée avec lui. Garde le flux courant visible et fixe les envois vers ce canal.\nFonctionne dans toutes les fenêtres, y compris la fenêtre 0 agrégée. /join ou /j seul efface la cible. Alias : /j."
help_join_name = "/join [canal] [clé]"
help_join_short = "rejoint un canal ou groupe et le choisit comme cible d'envoi"
help_key_c_long = "OSC 52, sans horodatage ni indentation."
help_key_c_name = "c"
help_key_c_short = "copie le texte du message (presse-papier)"
help_key_d_long = "Pour tout le monde, après confirmation (y/n)."
help_key_d_name = "d"
help_key_d_short = "supprime mon message sélectionné"
help_key_e_long = "Prompt ✎ #id ›, Entrée envoie, Échap annule."
help_key_e_name = "e"
help_key_e_short = "édite mon message sélectionné"
help_key_g_long = "Sur un message qui en cite un autre, g va au message cité ; dans une fenêtre /search, il ouvre la vraie conversation au résultat sélectionné. Un clic sur la citation fait de même. L'historique manquant entre les deux est chargé, et une ligne « … messages non chargés » marque le trou jusqu'à ce qu'une page le comble."
help_key_g_name = "g"
help_key_g_short = "saute au message cité, ou d'un résultat de recherche vers sa conversation"
help_key_i_long = "Échap retire ces lignes."
help_key_i_name = "i"
help_key_i_short = "infos : date, lecture, vues, réactions"
help_key_l_long = "l de nouveau met en pause. Sans son ; demande ffmpeg."
help_key_l_name = "l"
help_key_l_short = "lit une vidéo téléchargée dans le fil"
help_key_o_long = "Sur le message sélectionné ; un aperçu de lien demande avant d'ouvrir la page. Forme commande : /open N ouvre le N-ième média depuis la fin — /help open pour le détail."
help_key_o_name = "o"
help_key_o_short = "ouvre le média du message avec xdg-open"
help_key_p_long = "Prompt ↩ #id ›, la citation apparaît sous ma réponse."
help_key_p_name = "p"
help_key_p_short = "répond au message sélectionné"
help_key_r_long = "Telegram : le sélecteur ne propose que les réactions acceptées par la conversation. Discord : tout emoji, ceux du serveur en tête (:nom:). Le même choix une seconde fois la retire."
help_key_r_name = "r"
help_key_r_short = "réagit au message sélectionné"
help_key_s_long = ""
help_key_s_name = "s"
help_key_s_short = "revient au début de la vidéo en lecture"
help_key_v_long = "Échap ferme, o ouvre le fichier, c copie l'image dans le presse-papier. ←/→ montrent le média d'avant et d'après (dans la fenêtre, ou dans le navigateur de médias d'où il vient). +/- (ou la molette) zooment, 0 réajuste, ↑/↓ et Maj+←/→ déplacent la vue."
help_key_v_name = "v"
help_key_v_short = "aperçu plein écran du média du message"
help_kitty_images_long = "Au-delà, la plus anciennement affichée est libérée et retransmise à sa prochaine apparition."
help_kitty_images_name = "kitty_images"
help_kitty_images_short = "nombre d'images gardées transmises au terminal (LRU)"
help_lang_long = "Vide dans config.toml : la langue vient de $LC_ALL, $LC_MESSAGES ou $LANG, le premier défini (fr… donne fr, sinon en).\n/set lang fr ou /set lang en change la langue tout de suite et enregistre config.toml.\nUne chaîne « fr+en » prend chaque texte dans la première langue qui l'a, l'anglais restant le dernier recours."
help_lang_name = "lang"
help_lang_short = "langue de l'interface : fr, en, ou une chaîne fr+en"
help_link_previews_long = "Bloc │ sous le message : site, titre, description et vignette sur Telegram ; titre et description sur Discord. off : l'étiquette seule."
help_link_previews_name = "link_previews"
help_link_previews_short = "aperçu des liens : Telegram, intégrations Discord (on/off)"
help_log_dir_long = ""
help_log_dir_name = "log_dir"
help_log_dir_short = "répertoire des journaux de fenêtre"
help_log_long = "Ajoute les lignes de la fenêtre liée à une conversation dans <log_dir>/<titre>-<réseau>-<id>.log, horodatées.\n[log] apparaît dans la barre de statut. /set log on journalise toutes les nouvelles fenêtres."
help_log_name = "/log [on|off]"
help_log_opt_long = "/log par fenêtre force l'état individuellement."
help_log_opt_name = "log"
help_log_opt_short = "journaliser toutes les nouvelles fenêtres par défaut (on/off)"
help_log_short = "journalise la fenêtre courante (bascule ; on/off forcent)"
help_maps_long = "4 tuiles (zoom 15, repère rouge) : la carte va dans download_dir/maps, les tuiles dans le répertoire de cache.\nDésactivé par défaut : chaque position interroge tile.openstreetmap.org."
help_maps_name = "maps"
help_maps_short = "carte OpenStreetMap sous une position partagée (off par défaut)"
help_me_long = "Sur IRC elle part en CTCP ACTION et s'affiche * pseudo texte ; ailleurs en message en italique. Les styles Ctrl+B/U restent."
help_me_name = "/me <texte>"
help_me_short = "envoie une action en italique, comme sous ircii"
help_shrug_long = "/shrugs fait de même."
help_shrug_name = "/shrug [texte]"
help_shrug_short = "envoie le texte suivi de ¯\\_(ツ)_/¯"
help_msg_long = "Le nom est un nom exact de conversation ou un préfixe unique, jamais un mot à l'intérieur d'un nom ; un titre entier de plusieurs mots fonctionne (Tab le met). La ligne est reprise ici sous la forme [msg(nom)] texte. Alias : /m."
help_msg_name = "/msg <nom> <texte>"
help_msg_short = "envoie un message sans changer de fenêtre"
help_net_long = "Sans argument, cycle : tous les réseaux, puis chacun dans l'ordre des noms ; Shift+F2 fait le même cycle. /net all lève le filtre.\nLe panneau (F2) et la vue agrégée ne gardent alors que le réseau choisi ; une lettre en exposant devant chaque titre rappelle le réseau de la conversation.\nSans effet avec un seul réseau."
help_net_name = "/net [réseau]"
help_net_short = "filtre le panneau et la vue agrégée sur un réseau"
help_new_long = "Boîte centrée : la frappe filtre les conversations connues et les contacts du compte ;\nau bout de trois caractères (ou d'un @pseudo), une section « sur Telegram » ajoute les résultats\nde la recherche Telegram. Entrée ou clic ouvre la conversation, Échap ferme.\nMême boîte que la ligne « + nouveau message » en bas du panneau (F2). Indisponible en mode bot."
help_new_name = "/new"
help_new_short = "ouvre « nouvelle conversation » (ou Ctrl+N)"
help_no_topic = "pas d'aide pour « %s »"
help_notify_long = "terminal utilise OSC 777 (Ghostty/kitty), desktop appelle notify-send. Même règle que le bip : une fenêtre non affichée, ou le terminal sans le focus ; une rafale en donne une tout de suite, puis une pour le dernier message 2 s plus tard ; une conversation en sourdine ne notifie jamais."
help_notify_name = "notify"
help_notify_short = "notification sur message privé ou mention : terminal | desktop | off"
help_open_long = "Sans argument, ouvre le dernier média de la fenêtre."
help_open_name = "/open [N]"
help_open_short = "ouvre le N-ième média depuis la fin (xdg-open)"
help_pgupdn_long = "PgUp en haut de l'écran charge l'historique précédent depuis le réseau. Une image coupée par le bord de la fenêtre montre sa partie visible ; remonté dans l'historique, la pastille ↓ dernier message ramène à la fin d'un clic."
help_pgupdn_name = "PgUp/PgDn"
help_pgupdn_short = "défilement de la fenêtre"
help_query_long = "Fixe les envois vers un contact ou canal tout en gardant le flux de cette fenêtre visible, y compris la fenêtre 0 agrégée.\nLe prompt indique la cible. Les nouveaux messages et changements de fenêtre ne la modifient pas. /query ou /q seul l'efface.\nAlias : /q, /qu. Les préfixes de commandes uniques fonctionnent aussi sans Tab. /new ou le panneau ouvre la vue de la conversation."
help_query_name = "/query [nom]"
help_query_short = "fixe ou efface la cible d'envoi persistante de cette fenêtre (nom exact ou préfixe)"
help_quit_long = ""
help_quit_name = "/quit"
help_quit_short = "quitte ttyloom (ou Ctrl+C)"
help_redline_long = "Placée juste après le dernier message lu à l'entrée dans la fenêtre ; ne bouge pas tant qu'elle\nreste affichée, se recale au retour (autre fenêtre ou absence). off : rien."
help_redline_name = "redline"
help_redline_short = "ligne rouge de dernière lecture dans chaque fenêtre (on/off)"
help_rename_long = "Le nom local remplace le titre du réseau partout : panneau, barre de statut, notifications,\npréfixe [chat] de la vue agrégée et pseudo du pair en privé. Il ne part jamais sur le réseau.\n/rename <nom> renomme la conversation de la fenêtre courante ; dès qu'il reste du texte derrière\nle premier mot, ce mot est une cible (conversation, @pseudo ou nom local) et la commande refuse\ns'il ne désigne rien. Un nom ou une cible en plusieurs mots se met entre guillemets :\n/rename \"maman de Paris\" · /rename \"Friends - Blabla\" Blabla. 64 cellules au plus.\nLe vrai titre reste consultable dans /whois. Enregistré dans aliases.toml."
help_rename_name = "/rename [cible] <nom>"
help_rename_short = "renomme localement une conversation"
help_search_long = "Jusqu'à 50 résultats, dans une fenêtre « ?texte » liée à la même conversation ; Entrée ou g sur un résultat ouvre la vraie conversation à ce message ; /close la ferme.\nIndisponible en mode bot."
help_search_name = "/search <texte>"
help_search_short = "cherche l'historique de la conversation sur le serveur (Telegram, Discord)"
help_section_chats = "Conversations"
help_section_input = "Saisie"
help_section_media = "Médias"
help_section_messages = "Messages"
help_section_options = "Options"
help_section_sidebar = "Panneau"
help_section_windows = "Fenêtres"
help_send_long = "Sur Telegram png/jpeg part en photo, une vidéo ou un son avec ses métadonnées ffprobe, le reste en document ; sur Discord en pièce jointe ; dans une conversation privée IRC en DCC SEND. 2 Go au plus. Tab complète le chemin (~ et espaces permis, un dossier reçoit son /). Ctrl+V colle une image du presse-papier et demande avant de l'envoyer."
help_send_name = "/send <chemin> [légende]"
help_send_short = "envoie un fichier local (photo, vidéo, document)"
help_separator_long = ""
help_separator_name = "separator"
help_separator_short = "ligne ─ entre les messages et la barre de statut (on/off)"
help_set_long = "/set seul affiche toutes les clés ; /set <clé> affiche sa valeur ; /set <clé> <valeur> la modifie\net enregistre config.toml. Tab complète les clés puis les valeurs. Voir /help <clé> pour chaque option."
help_set_name = "/set [clé [valeur]]"
help_set_short = "affiche ou modifie une option à chaud"
help_shift_enter_long = "Alt+Entrée fait de même. Entrée envoie le message avec ses sauts de ligne, Ctrl+Entrée aussi ;\nune commande /… reste sur une ligne. Demande un terminal qui gère le protocole clavier kitty\n(Ghostty, kitty, WezTerm, foot) ; ailleurs, un collage multiligne reste la voie.\nAvec /set multiline on, Shift+Entrée ouvre la zone de saisie étendue ; Échap la replie sans perdre le texte."
help_shift_enter_name = "Shift+Entrée"
help_shift_enter_short = "saut de ligne dans la saisie, affiché ⏎"
help_shift_f2_long = "Équivalent de /net sans argument : tous les réseaux, puis chacun dans l'ordre des noms.\nLe panneau — conversations comme fenêtres — et la vue agrégée ne gardent alors que le réseau choisi.\nAvec un seul réseau : aucun effet et aucune ligne en fenêtre."
help_shift_f2_name = "Shift+F2"
help_shift_f2_short = "cycle le filtre réseau (comme /net)"
help_spell_name = "spell"
help_spell_short = "correction de la saisie : off | fr | us | en_GB | fr+us…"
help_spell_long = "Fautes en rouge dans la saisie. Ctrl+R parcourt (Entrée corrige, i ignore, a ajoute au dico perso, Ctrl+R saute, Échap quitte) ; clic droit sur un mot souligné pour le corriger seul. Dictionnaires hunspell du système (paquets hunspell-fr, hunspell-en-us) : tout dictionnaire de /usr/share/hunspell est accepté, Tab les liste."
help_spell_quotes_name = "spell_quotes"
help_spell_quotes_short = "on : vérifie aussi les citations > et les blocs ```"
help_spell_quotes_long = "off (défaut) : les lignes citées avec > et les blocs ``` ne sont pas vérifiés."
help_ctrl_r_name = "Ctrl+R"
help_ctrl_r_short = "parcourt les fautes de la saisie"
help_ctrl_r_long = "Entrée corrige avec la suggestion choisie (↑/↓), i ignore pour la session, a ajoute au dico perso, Ctrl+R saute au mot suivant, Échap quitte. Voir /set spell."
help_sidebar_sort_long = "F7 cycle."
help_sidebar_sort_name = "sidebar_sort"
help_sidebar_sort_short = "ordre du panneau : recent | alpha | unread"
help_sidebar_split_long = "Le ⊟ de l'en-tête le bascule d'un clic. Chaque section garde l'ordre de sidebar_sort."
help_sidebar_split_name = "sidebar_split"
help_sidebar_split_short = "liste des fenêtres en deux sections : salons, puis messages directs"
help_sidebar_width_long = "La barre │ du panneau se glisse à la souris : la largeur atteinte est enregistrée."
help_sidebar_width_name = "sidebar_width"
help_sidebar_width_short = "largeur du panneau (12 à la moitié de l'écran)"
help_tabs_long = "on : [*] [telegram(6)] [discord] à droite de la ligne d'état, cliquables ; l'onglet du réseau courant remplace son segment [net]. F9 les parcourt. off : les onglets disparaissent, le cycle des fenêtres redevient global. Sans effet avec un seul réseau."
help_tabs_name = "tabs"
help_tabs_short = "onglets par réseau à droite de la ligne d'état (F9)"
help_theme_long = "/theme seul ouvre un sélecteur filtrable (↑/↓ aperçu en direct, Entrée valide, Échap restaure).\n/theme list [filtre] liste les thèmes. Tab complète le nom."
help_theme_name = "/theme [nom]"
help_theme_short = "sélecteur de thème, ou /theme <nom> l'applique"
help_timestamps_long = ""
help_timestamps_name = "timestamps"
help_timestamps_short = "horodatage devant chaque message (on/off)"
help_timestamps_seconds_long = ""
help_timestamps_seconds_name = "timestamps_seconds"
help_timestamps_seconds_short = "horodatage avec les secondes, 15:04:05 (on/off)"
help_cycle_mode_long = "last_unread : Ctrl+X va de fenêtre non lue en fenêtre non lue (ordre des numéros), puis revient à celle quittée ; sans non-lus, cycle classique."
help_cycle_mode_name = "cycle_mode"
help_cycle_mode_short = "comportement de Ctrl+X : next | last_unread"
help_multiline_long = "Échap replie la zone étendue sans perdre le brouillon ; Entrée envoie et replie.\nUn collage multiligne dans la zone étendue propose : insérer tel quel ou en bloc de code (```)."
help_multiline_name = "multiline"
help_multiline_short = "Shift+Entrée ouvre la zone de saisie étendue (on/off)"
help_try = " (essayez : %s)"
help_unrename_long = "Sans argument : la conversation de la fenêtre courante. Le titre du réseau revient partout.\nLa cible peut tenir en plusieurs mots, avec ou sans guillemets."
help_unrename_name = "/unrename [cible]"
help_unrename_short = "retire le nom local d'une conversation"
help_video_long = "show garde le comportement historique : la première image seule, la touche l lance la lecture.\nhidden ne réserve aucune ligne pour les vidéos : étiquette seule, l'aperçu v et la touche o restent disponibles.\nautoplay lance la lecture dès qu'une vidéo téléchargée est décodée, en boucle ; s arrête, l reprend la main. Le nombre d'images décodées reste borné par video_inline_frames."
help_video_name = "video"
help_video_short = "vidéo en ligne : show | hidden | autoplay"
help_gifplay_long = "always anime tous les GIF à l'écran, comme avant.\nhover n'anime que le GIF du message sous la souris (hover doit être actif) ; les autres restent sur leur image.\noff montre la première image seule."
help_gifplay_name = "gifplay"
help_gifplay_short = "GIF animés : always | hover | off"
help_view_long = "Équivalent à la touche v sur un message sélectionné."
