usage_hooks = "usage : /hooks [reload | test <nom> <texte>]"
help_hooks_name = "/hooks [reload | test <nom> <texte>]"
help_hooks_short = "programmes lancés sur les messages reçus (hooks.toml)"
help_hooks_long = "hooks.toml, à côté de config.toml, liste des programmes lancés quand un message reçu passe leurs filtres (réseau, salon, type, expéditeur, motif, mention) ; leur sortie peut être envoyée, proposée dans la saisie, affichée ou ignorée. ttyloom n'écrit jamais ce fichier. /hooks liste les hooks avec leurs compteurs et leur dernier résultat ; /hooks reload relit le fichier ; /hooks test <nom> <texte> exécute un hook comme si vous écriviez <texte> dans le salon courant : seul match est vérifié, et la sortie est affichée, jamais envoyée. Le manuel : docs/hooks.md."
