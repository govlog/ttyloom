help_whois_short = "profil et présence d'un utilisateur"
help_window_long = "/window new crée une fenêtre et y bascule tout de suite ; /window new hide la crée sans y aller.\n/window close ferme la fenêtre courante (jamais la fenêtre 0).\n/window list (ou /window seul) liste les fenêtres et leur activité.\n/win N ou /win nom bascule directement vers une fenêtre. Alias : /w, /win.\n/N tout court fait la même chose : /5, /21."
