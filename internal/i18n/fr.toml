usage_media = "usage : /media [media | gifs | files]"
help_media_name = "/media [media | gifs | files]"
help_media_short = "navigateur des médias de la conversation"
help_media_long = "Les photos et vidéos, les GIF ou les fichiers de la conversation de la fenêtre, envoyés par n'importe qui, du plus récent au plus ancien (Telegram, Discord). Jusqu'à six sur quatre à la fois ; la molette ou l'ascenseur montre les autres, et la suite se charge au fur et à mesure. Tab et Maj+Tab, ou un clic sur un onglet, changent d'onglet. Entrée ou un clic montre le média, puis ←/→ parcourent la liste (un fichier s'ouvre avec son programme) ; j va à son message, o l'ouvre, Échap ferme. Seul le GIF sous la souris s'anime. Une case montre la petite image que donne le réseau, un petit GIF lui-même, ou le nom, la taille, l'expéditeur et la date d'un fichier ; un média sans petite image se télécharge dans download_dir comme ceux de la conversation s'il reste sous auto_media_max_kb."
