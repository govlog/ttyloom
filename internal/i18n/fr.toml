help_view_short = "aperçu plein écran du N-ième média"
help_whois_long = "Sans argument, décrit la conversation privée courante. Réservé aux utilisateurs.\nSur IRC un pseudo n'a besoin d'aucune conversation ouverte, mais le réseau doit être désigné par la fenêtre ou par son onglet ; déduit d'un réseau IRC unique (fenêtre 0), le nom est d'abord cherché parmi les conversations et ne part vers IRC que si aucune ne correspond. Discord ne le gère pas."
