help_mute_name = "/mute [nom]"
help_mute_short = "ni bip ni notification pour une conversation"
help_mute_long = "Met en sourdine la conversation de la fenêtre, ou celle nommée (nom exact ou préfixe). Une conversation en sourdine ne fait jamais sonner le bip, n'envoie aucune notification (terminal ou bureau) et ne clignote pas dans le panneau, même sur une mention ; son compteur de non-lus reste, en gris, sur sa seule ligne (ni dans [Act: …] ni dans le compteur de son onglet). Sans nom, dans une fenêtre sans conversation, liste les conversations en sourdine. Propre à ttyloom (muted.toml, à côté de config.toml) : le réseau n'en sait rien. /unmute l'annule."
