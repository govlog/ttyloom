name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Install native test dependencies
        run: sudo apt-get update && sudo apt-get install -y libhunspell-dev hunspell-fr hunspell-en-us ffmpeg
      - run: go test -race ./...
      - run: go test -tags nospell ./...
      - run: go vet ./...
      - run: go mod tidy -diff
      - name: Build without C dependencies
        run: CGO_ENABLED=0 go build -trimpath -tags nospell -o /tmp/ttyloom ./cmd/ttyloom
