name: Release
on:
  push:
    tags:
      - 'v*'
permissions:
  contents: read
jobs:
  # The tests, the build and the check of the binaries run the code of the
  # repository and of its dependencies: no token able to write or to sign.
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Test portable build
        run: CGO_ENABLED=0 go test -tags nospell ./...
      - name: Build archives
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: bash scripts/release.sh "$RELEASE_TAG"
      - name: Check binaries
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-user
          cd "$RUNNER_TEMP"
          tar -xzf "$GITHUB_WORKSPACE/dist/$RELEASE_TAG/ttyloom_${RELEASE_TAG#v}_linux_amd64.tar.gz"
          tar -xzf "$GITHUB_WORKSPACE/dist/$RELEASE_TAG/ttyloom_${RELEASE_TAG#v}_linux_arm64.tar.gz"
          "./ttyloom_${RELEASE_TAG#v}_linux_amd64/ttyloom" --version
          qemu-aarch64 "./ttyloom_${RELEASE_TAG#v}_linux_arm64/ttyloom" --version
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/${{ github.ref_name }}/
          if-no-files-found: error
  # Signs and publishes what the build made; no code of the repository runs here.
  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/${{ github.ref_name }}
      - name: Check checksums
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: cd "dist/$RELEASE_TAG" && sha256sum --check SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: 'dist/${{ github.ref_name }}/*.tar.gz'
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          notes="$RUNNER_TEMP/notes.md"
          echo 'Portable Linux binaries for x86-64 and ARM64 (without Hunspell), matching source and SHA-256 checksums. See the README for installation and source builds with spell checking.' > "$notes"
          awk -v h="## $RELEASE_TAG " 'index($0, "## ") == 1 { p = index($0, h) == 1; next } p' CHANGELOG.md > "$notes.section"
          grep -q . "$notes.section" || { echo "CHANGELOG.md has no section for $RELEASE_TAG" >&2; exit 1; }
          cat "$notes.section" >> "$notes"
          gh release create "$RELEASE_TAG" "dist/$RELEASE_TAG/"*.tar.gz "dist/$RELEASE_TAG/SHA256SUMS" \
            --verify-tag --draft --prerelease --title "TTYloom $RELEASE_TAG" \
            --notes-file "$notes"
