help_discord_name = "/discord [status|login|logout|disconnect]"
help_discord_short = "Discord account: status, login (QR code, or token_cmd again), logout, disconnect."
help_discord_long = "/discord or /discord status says whether Discord is stopped, connecting, connected (and as whom) or reconnecting after a cut. /discord login starts it again: at once with the token of the QR login, else with a new QR code to scan with the Discord app; with token_cmd, the command runs again (a token renewed in the password manager is taken without leaving). /discord logout ends the session on the server and deletes the token file; with token_cmd it only disconnects, the token is yours. /discord disconnect closes the connection and keeps the token."
