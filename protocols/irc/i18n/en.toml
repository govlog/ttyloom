help_irc_name = "/irc [add | connect <name> | disconnect <name> | delete <name>]"
help_irc_short = "IRC networks: status, add one (a form), connect, disconnect, delete."
help_irc_long = "/irc alone lists the IRC networks of config.toml with their state. /irc add opens a form — name, host, port, TLS, nick, user, real name, NickServ password — and connects the new network, saved as an [[irc]] table; ← → on the hostname field cycle through the well-known networks (Libera.Chat, OFTC, EFnet, DALnet, Undernet, IRCnet, QuakeNet, Rizon, hackint…) and fill host, port, TLS and name. /irc connect <name> and /irc disconnect <name> start and stop one; /irc delete <name> stops it, removes its [[irc]] table from config.toml and closes its windows. Rooms joined with /join are remembered and joined again at the next start; /part forgets them. Each network is its own section of the sidebar, named after it."
help_dcc_name = "/dcc [send <nick> <path> | get [nick]]"
help_dcc_short = "DCC file transfers: send a file to a nick, fetch an offer, list them."
help_dcc_long = "/dcc alone lists the offers waiting and the transfers running. /dcc send <nick> <path> sends a file straight to that person (from an IRC window, or with a single IRC network configured); /send <path> in a private IRC chat does the same. An offer received shows as a file line in the private chat: /dcc get takes the last one of the window (/dcc get <nick> the one of that chat), the download key on the line too. The file lands in download_dir. dcc_ip and dcc_ports in the [[irc]] table set the address announced and the ports used when a NAT or a firewall is in the way."
