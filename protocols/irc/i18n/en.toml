irc_bad_host = "hostname required"
irc_bad_port = "port: 1 to 65535"
irc_tls_password = "TLS no with a password: it would go in clear. Set TLS yes, or leave the password empty"
irc_not_saved = "config.toml could not be written"
irc_added = "%s added to config.toml"
irc_deleted = "%s removed from config.toml"
dcc_none = "no DCC offer nor transfer"
dcc_which_net = "several IRC networks: use /dcc send from a window of the network"
dcc_no_offer = "no DCC offer waiting %s"
help_section_irc = "IRC"
help_part_name = "/part [#room] [reason]"
help_part_short = "leaves the room (the current one by default) and forgets it"
help_part_long = "PART with the reason; the room leaves the [[irc]] table and its window closes. This is the command other clients call /leave; ttyloom only knows /part."
help_cycle_name = "/cycle [#room]"
help_cycle_short = "leaves and rejoins the room"
help_cycle_long = "PART then JOIN on the same room, the window kept: the way to take ops back, or to redo a join that went wrong."
help_topic_name = "/topic [#room] [text]"
help_topic_short = "shows or sets the topic"
help_topic_long = "With no text, the server answers the topic of the room and who set it; with a text, it becomes the new topic (mode +t: ops only)."
help_nick_name = "/nick <nick>"
help_nick_short = "changes my nick on this network"
help_nick_long = "NICK on the network of the window; the other networks keep theirs. A nick already taken is refused by the server, which says so in the window."
help_notice_name = "/notice <target> <text>"
help_notice_short = "sends a NOTICE to a nick or a room"
help_notice_long = "A NOTICE is the message a bot or a service is not meant to answer; the target is a nick or a #room."
help_invite_name = "/invite <nick> [#room]"
help_invite_short = "invites a nick into the room"
help_invite_long = "INVITE, needed to enter a room in mode +i; the room is the one of the window by default."
help_names_name = "/names [#room]"
help_names_short = "lists the nicks of the room in the window (F3 opens the box)"
help_names_long = "NAMES on the room of the window; the answer shows in the window, ops (@) and voices (+) marked. F3 opens the same list as a box."
help_mode_name = "/mode [target] [modes…]"
help_mode_short = "shows or sets channel or user modes (/mode #room +ntk key)"
help_mode_long = "Sent as typed: /mode #room +b lists the bans, /mode #room +o nick gives ops, /mode alone in a room shows its modes. The answers land in the current window."
help_kick_name = "/kick [#room] <nick> [reason]"
help_kick_short = "kicks a nick out of the room"
help_kick_long = "KICK on the room of the window unless another one is named; ops only. The reason is free text."
help_ban_name = "/ban [#room] <nick | mask>"
help_ban_short = "bans a mask; a nick is turned into *!*@host (USERHOST)"
help_ban_long = "Mode +b on the room. A mask (nick!user@host, * and ? wildcards) goes out as typed; a bare nick is resolved with USERHOST first, so that the ban follows the host and not the nick."
help_kickban_name = "/kickban [#room] <nick> [reason]"
help_kickban_short = "bans then kicks"
help_kickban_long = "The ban first, so that the nick cannot come back before the mode is set; same arguments as /kick."
help_who_name = "/who [mask]"
help_who_short = "WHO: the users of a room or matching a mask"
help_who_long = "WHO on the room of the window with no argument; a mask (*!*@*.fr, nick*) asks the server for the users it matches. The answer lands in the window as text lines."
help_whowas_name = "/whowas <nick>"
help_whowas_short = "the last known identity of a nick that left"
help_whowas_long = "WHOWAS: what the server remembers of a nick that is gone or renamed — useful to build a ban mask after a quit."
help_motd_name = "/motd"
help_motd_short = "message of the day of the server (shown in window 0 at connection)"
help_motd_long = "MOTD: the server shows it again, in the window the command was typed in."
help_ctcp_name = "/ctcp <nick> <VERSION | PING | TIME | …>"
help_ctcp_short = "sends a CTCP request; the answer shows as [ctcp(nick)]"
help_ctcp_long = "CTCP asks a client about itself: VERSION, PING, TIME, CLIENTINFO. The answer comes back as a line of the window; a client that ignores CTCP answers nothing."
help_quote_name = "/quote <raw line>"
help_quote_short = "sends a raw IRC line as typed"
help_quote_long = "The line goes to the server with nothing added — for what the client has no command for (SERVICES, CAP, LIST…). Nothing is checked: a wrong line is answered by the server."
help_ignore_name = "/ignore [nick | mask]"
help_ignore_short = "lists, adds or removes an ignored mask (saved in ignores of [[irc]])"
help_ignore_long = "A nick becomes nick!*@*, user@host becomes *!user@host; * and ? are wildcards. Typing an existing mask removes it. Messages, notices, actions and CTCP of a matching source are dropped by the network."
