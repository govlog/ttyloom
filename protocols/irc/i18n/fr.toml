help_irc_name = "/irc [add | connect <nom> | disconnect <nom> | delete <nom>]"
help_irc_short = "Réseaux IRC : état, ajout (formulaire), connexion, déconnexion, suppression."
help_irc_long = "/irc seul liste les réseaux IRC de config.toml avec leur état. /irc add ouvre un formulaire — nom, hôte, port, TLS, pseudo, utilisateur, nom réel, mot de passe NickServ — et connecte le nouveau réseau, enregistré comme table [[irc]] ; ← → sur le champ hôte font défiler les réseaux connus (Libera.Chat, OFTC, EFnet, DALnet, Undernet, IRCnet, QuakeNet, Rizon, hackint…) et remplissent hôte, port, TLS et nom. /irc connect <nom> et /irc disconnect <nom> démarrent et arrêtent un réseau ; /irc delete <nom> l'arrête, retire sa table [[irc]] de config.toml et ferme ses fenêtres. Les salons rejoints par /join sont mémorisés et rejoints au prochain démarrage ; /part les oublie. Chaque réseau est une section du panneau latéral, à son nom."
help_dcc_name = "/dcc [send <pseudo> <chemin> | get [pseudo]]"
help_dcc_short = "Transferts DCC : envoyer un fichier à un pseudo, accepter une offre, les lister."
help_dcc_long = "/dcc seul liste les offres en attente et les transferts en cours. /dcc send <pseudo> <chemin> envoie un fichier directement à cette personne (depuis une fenêtre IRC, ou avec un seul réseau IRC configuré) ; /send <chemin> dans une conversation privée IRC fait la même chose. Une offre reçue apparaît comme une ligne fichier dans la conversation privée : /dcc get prend la dernière de la fenêtre (/dcc get <pseudo> celle de cette conversation), la touche de téléchargement sur la ligne aussi. Le fichier arrive dans download_dir. dcc_ip et dcc_ports dans la table [[irc]] fixent l'adresse annoncée et les ports utilisés derrière un NAT ou un pare-feu."
usage_irc = "usage : /irc [add | connect <nom> | disconnect <nom> | delete <nom>]"
usage_dcc = "usage : /dcc [send <pseudo> <chemin> | get [pseudo]]"
