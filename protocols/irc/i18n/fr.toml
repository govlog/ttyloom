dcc_none = "aucune offre ni transfert DCC"
dcc_which_net = "plusieurs réseaux IRC : /dcc send depuis une fenêtre du réseau"
dcc_no_offer = "aucune offre DCC en attente %s"
help_section_irc = "IRC"
help_part_name = "/part [#salon] [raison]"
help_part_short = "quitte le salon (le courant par défaut) et l'oublie"
help_part_long = "PART avec la raison ; le salon sort de la table [[irc]] et sa fenêtre se ferme. C'est la commande que les autres clients appellent /leave ; ttyloom ne connaît que /part."
help_cycle_name = "/cycle [#salon]"
help_cycle_short = "quitte puis rejoint le salon"
help_cycle_long = "PART puis JOIN sur le même salon, la fenêtre conservée : de quoi reprendre l'op, ou refaire un join raté."
help_topic_name = "/topic [#salon] [texte]"
help_topic_short = "affiche ou change le sujet"
help_topic_long = "Sans texte, le serveur répond le sujet du salon et qui l'a posé ; avec un texte, il devient le nouveau sujet (mode +t : réservé aux ops)."
help_nick_name = "/nick <pseudo>"
help_nick_short = "change mon pseudo sur ce réseau"
help_nick_long = "NICK sur le réseau de la fenêtre ; les autres réseaux gardent le leur. Un pseudo déjà pris est refusé par le serveur, qui le dit dans la fenêtre."
help_notice_name = "/notice <cible> <texte>"
help_notice_short = "envoie un NOTICE à un pseudo ou à un salon"
help_notice_long = "Un NOTICE est le message auquel un robot ou un service n'est pas censé répondre ; la cible est un pseudo ou un #salon."
help_invite_name = "/invite <pseudo> [#salon]"
help_invite_short = "invite un pseudo dans le salon"
help_invite_long = "INVITE, nécessaire pour entrer dans un salon en mode +i ; le salon est celui de la fenêtre par défaut."
help_names_name = "/names [#salon]"
help_names_short = "liste les pseudos du salon dans la fenêtre (F3 ouvre le cadre)"
help_names_long = "NAMES sur le salon de la fenêtre ; la réponse s'affiche dans la fenêtre, ops (@) et voices (+) marqués. F3 ouvre la même liste en cadre."
help_mode_name = "/mode [cible] [modes…]"
help_mode_short = "affiche ou change les modes d'un salon ou d'un pseudo (/mode #salon +ntk clé)"
help_mode_long = "Envoyé tel quel : /mode #salon +b liste les bans, /mode #salon +o pseudo donne l'op, /mode seul dans un salon affiche ses modes. Les réponses arrivent dans la fenêtre courante."
help_kick_name = "/kick [#salon] <pseudo> [raison]"
help_kick_short = "éjecte un pseudo du salon"
help_kick_long = "KICK sur le salon de la fenêtre sauf si un autre est nommé ; réservé aux ops. La raison est du texte libre."
help_ban_name = "/ban [#salon] <pseudo | masque>"
help_ban_short = "bannit un masque ; un pseudo est converti en *!*@hôte (USERHOST)"
help_ban_long = "Mode +b sur le salon. Un masque (pseudo!user@hôte, jokers * et ?) part tel quel ; un pseudo seul est d'abord résolu par USERHOST, pour que le ban suive l'hôte et non le pseudo."
help_kickban_name = "/kickban [#salon] <pseudo> [raison]"
help_kickban_short = "bannit puis éjecte"
help_kickban_long = "Le ban d'abord, pour que le pseudo ne revienne pas avant la pose du mode ; mêmes arguments que /kick."
help_who_name = "/who [masque]"
help_who_short = "WHO : les utilisateurs d'un salon ou correspondant à un masque"
help_who_long = "WHO sur le salon de la fenêtre sans argument ; un masque (*!*@*.fr, pseudo*) demande au serveur les utilisateurs qui correspondent. La réponse arrive en lignes de texte dans la fenêtre."
help_whowas_name = "/whowas <pseudo>"
help_whowas_short = "dernière identité connue d'un pseudo parti"
help_whowas_long = "WHOWAS : ce que le serveur garde d'un pseudo parti ou renommé ; utile pour bâtir un masque de ban après un quit."
help_motd_name = "/motd"
help_motd_short = "message du jour du serveur (affiché en fenêtre 0 à la connexion)"
help_motd_long = "MOTD : le serveur le réaffiche, dans la fenêtre où la commande a été tapée."
help_ctcp_name = "/ctcp <pseudo> <VERSION | PING | TIME | …>"
help_ctcp_short = "envoie une requête CTCP ; la réponse s'affiche en [ctcp(pseudo)]"
help_ctcp_long = "CTCP interroge un client sur lui-même : VERSION, PING, TIME, CLIENTINFO. La réponse revient en ligne de la fenêtre ; un client qui ignore le CTCP ne répond rien."
help_quote_name = "/quote <ligne brute>"
help_quote_short = "envoie une ligne IRC brute telle quelle"
help_quote_long = "La ligne part au serveur sans rien y ajouter, pour ce dont le client n'a pas de commande (SERVICES, CAP, LIST…). Rien n'est vérifié : une ligne fausse est refusée par le serveur."
help_ignore_name = "/ignore [pseudo | masque]"
help_ignore_short = "liste, ajoute ou retire un masque ignoré (gardé dans ignores de [[irc]])"
help_ignore_long = "Un pseudo devient pseudo!*@*, user@hôte devient *!user@hôte ; * et ? sont des jokers. Retaper un masque existant le retire. Messages, notices, actions et CTCP d'une source correspondante sont jetés par le réseau."
irc_setup_intro = "Choisissez un réseau connu avec ← →, ou tapez un serveur."
